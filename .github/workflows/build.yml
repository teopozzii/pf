name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: BankStatementApp.exe
            asset_name: BankStatementApp-Windows.exe
          - os: macos-latest
            asset_name: BankStatementApp-MacOS.zip

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller launcher.py --onefile --windowed --name BankStatementApp --add-data "assets;assets" --add-data "pages;pages" --add-data "utils;utils" --hidden-import dash_pages --hidden-import dash_bootstrap_components --hidden-import plotly.io._renderers

      - name: Build with PyInstaller (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller launcher.py --windowed --name BankStatementApp --add-data "assets:assets" --add-data "pages:pages" --add-data "utils:utils" --hidden-import dash_pages --hidden-import dash_bootstrap_components --hidden-import plotly.io._renderers

      - name: Rename Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: move dist/BankStatementApp.exe BankStatementApp-Windows.exe

      - name: Package Artifact (MacOS)
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BankStatementApp.app BankStatementApp-MacOS.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
